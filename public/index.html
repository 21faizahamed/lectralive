<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lectralive - Accessible Classrooms</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%234f46e5'/><path d='M12 6C13.1046 6 14 6.89543 14 8C14 9.10457 13.1046 10 12 10C10.8954 10 10 9.10457 10 8C10 6.89543 10.8954 6 12 6Z' fill='white'/><path d='M12 11C8.68629 11 6 13.6863 6 17V18H18V17C18 13.6863 15.3137 11 12 11Z' fill='white'/></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>

    <!-- Top Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="24" height="24" rx="6" fill="var(--primary)" />
                    <path
                        d="M12 6C13.1046 6 14 6.89543 14 8C14 9.10457 13.1046 10 12 10C10.8954 10 10 9.10457 10 8C10 6.89543 10.8954 6 12 6Z"
                        fill="white" />
                    <path d="M12 11C8.68629 11 6 13.6863 6 17V18H18V17C18 13.6863 15.3137 11 12 11Z" fill="white" />
                </svg>
                <span>lectralive</span>
            </div>

            <div class="nav-actions">
                <button id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode">
                    <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>

                    <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>

                <button class="nav-signin" type="button">Sign In</button>
            </div>
        </div>
    </nav>

    <!-- Landing -->
    <main class="view active" id="landing-view">
        <div class="landing-container">
            <!-- Left Hero Section -->
            <div class="hero">
                <h1 class="hero-title">Classrooms made <span class="highlight">accessible</span> for everyone.</h1>
                <p class="hero-subtitle">Live captions, anonymous Q&A, and AI-powered moderation to ensure every student
                    can participate with confidence.</p>

                <div class="join-box">
                    <input type="text" placeholder="Enter Room Code (e.g. bio-101)" id="room-code-input"
                        autocomplete="off">
                    <button class="btn btn-primary join-btn" id="join-btn" type="button">
                        Join
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </button>
                </div>

                <div class="features-badges">
                    <div class="badge">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z">
                            </path>
                        </svg>
                        Live Captions
                    </div>
                    <div class="badge">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                        </svg>
                        Anonymous Q&A
                    </div>
                    <div class="badge">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                        Inclusive Design
                    </div>
                </div>
            </div>

            <!-- Right Auth Card -->
            <div class="auth-box">
                <div class="auth-card">
                    <div class="auth-tabs">
                        <button class="auth-tab active" data-tab="login" type="button">Login</button>
                        <button class="auth-tab" data-tab="register" type="button">Register</button>
                    </div>

                    <!-- Login Form -->
                    <form id="login-form" class="auth-form active">
                        <div class="form-group">
                            <label>Username</label>
                            <input type="text" placeholder="jdoe" required />
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" required />
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
                    </form>

                    <!-- Register Form -->
                    <form id="register-form" class="auth-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Username</label>
                                <input type="text" placeholder="jdoe" required />
                            </div>
                            <div class="form-group">
                                <label>I am a...</label>
                                <select required>
                                    <option value="student">Student</option>
                                    <option value="instructor">Instructor</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Display Name</label>
                            <input type="text" placeholder="John Doe" required />
                        </div>

                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" required />
                        </div>

                        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Action Bar -->
    <footer class="bottom-bar">
        <p>© 2026 lectralive. Building inclusive classrooms together.</p>
    </footer>

    <script type="module" src="/js/landing.js"></script>
</body>

</html>
