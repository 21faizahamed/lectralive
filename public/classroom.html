<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>lectralive - Classroom</title>

  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%234f46e5'/><path d='M12 6C13.1046 6 14 6.89543 14 8C14 9.10457 13.1046 10 12 10C10.8954 10 10 9.10457 10 8C10 6.89543 10.8954 6 12 6Z' fill='white'/><path d='M12 11C8.68629 11 6 13.6863 6 17V18H18V17C18 13.6863 15.3137 11 12 11Z' fill='white'/></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-D197ZHGZ7C"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-D197ZHGZ7C');
  </script>
</head>

<body>

  <nav class="navbar">
    <div class="nav-container">
      <div class="logo" onclick="window.location.href='index.html'">
        <span>lectralive</span>
      </div>

      <div class="nav-actions">
        <button id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode">
          <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>

          <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>

        <button class="btn btn-outline" id="dashboard-btn" type="button" style="margin-right: 0.5rem; display: none;">Dashboard</button>
        <button class="btn btn-outline" id="signout-btn" type="button">Sign out</button>
      </div>
    </div>
  </nav>

  <main id="classroom-view" class="view active">
    <div class="classroom-container">

      <div class="classroom-main">
        <div class="classroom-header module">
          <div class="classroom-info">
            <h2 id="class-title">Room: …</h2>
            <div class="status-meta">
              <span class="status-dot"></span>
              <span id="connection-status">Checking login…</span>
              <span class="dot-separator">•</span>
              You: <span id="user-badge">Loading…</span>
            </div>
          </div>

          <div class="header-actions" style="display: flex; gap: 1rem; align-items: center;">
            <button class="btn btn-primary" id="broadcast-btn" type="button" style="display: none; background: #e11d48; border-color: #be123c;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 0.5rem;"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
              Start Broadcast
            </button>
            <button class="btn btn-outline text-size-btn" type="button">
              <span style="font-size: 1.2rem; font-weight: 500;">T</span> Text Size
            </button>
          </div>
        </div>

        <div class="video-captions-area module" id="captions-area">
          <p class="placeholder-text">Captions will appear here when the session starts…</p>
        </div>
      </div>

      <div class="qa-sidebar module">
        <div class="qa-header">
          <div class="qa-title">
            <h3>Q&A</h3>
          </div>
          <span class="active-count" id="active-count">0 Active</span>
        </div>

        <div class="qa-feed" id="qa-feed"></div>

        <div class="qa-input-area">
          <div style="position: relative;">
            <textarea class="qa-textarea" id="qa-input" placeholder="Ask a question..." style="padding-right: 120px; width: 100%;"></textarea>
            <select id="qa-target" class="btn btn-outline" style="position: absolute; right: 8px; top: 8px; padding: 0.3rem 0.5rem; height: auto; font-size: 0.8rem; width: auto; background-color: var(--surface-color); border: 1px solid var(--border-color); color: var(--text-main);">
              <option value="ai">Ask AI</option>
              <option value="professor">Ask Professor</option>
            </select>
          </div>
          <div class="qa-controls" style="justify-content: space-between; align-items: center; margin-top: 0.5rem;">
            <label style="font-size: 0.8rem; display: flex; align-items: center; gap: 0.4rem; color: var(--text-muted); cursor: pointer;">
              <input type="checkbox" id="anon-checkbox"> Send anonymously
            </label>
            <button class="btn btn-primary submit-btn" id="submit-btn" type="button">Submit</button>
          </div>
        </div>
      </div>

    </div>
  </main>

  <footer class="bottom-bar">
    <p>© 2026 lectralive. Building inclusive classrooms together.</p>
  </footer>

  <script type="module" src="js/classroom.js"></script>
</body>

</html>
