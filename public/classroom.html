<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lectralive - Classroom</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%234f46e5'/><path d='M12 6C13.1046 6 14 6.89543 14 8C14 9.10457 13.1046 10 12 10C10.8954 10 10 9.10457 10 8C10 6.89543 10.8954 6 12 6Z' fill='white'/><path d='M12 11C8.68629 11 6 13.6863 6 17V18H18V17C18 13.6863 15.3137 11 12 11Z' fill='white'/></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <!-- Top Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo" onclick="window.location.href='/'">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="24" height="24" rx="6" fill="var(--primary)" />
                    <path
                        d="M12 6C13.1046 6 14 6.89543 14 8C14 9.10457 13.1046 10 12 10C10.8954 10 10 9.10457 10 8C10 6.89543 10.8954 6 12 6Z"
                        fill="white" />
                    <path d="M12 11C8.68629 11 6 13.6863 6 17V18H18V17C18 13.6863 15.3137 11 12 11Z" fill="white" />
                </svg>
                <span>lectralive</span>
            </div>

            <div class="nav-actions">
                <button id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode">
                    <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>

                    <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </div>
        </div>
    </nav>

    <!-- CLASSROOM VIEW -->
    <main id="classroom-view" class="view active">
        <div class="classroom-container">
            <!-- Main Content Area -->
            <div class="classroom-main">
                <div class="classroom-header module">
                    <div class="classroom-info">
                        <h2 id="class-title">Loading room…</h2>
                        <div class="status-meta">
                            <span class="status-dot"></span>
                            <span id="connection-status">Connecting…</span>
                            <span class="dot-separator">•</span>
                            Instructor: <span id="instructor-name">Unknown</span>
                        </div>
                    </div>
                    <button class="btn btn-outline text-size-btn" type="button">
                        <span style="font-size: 1.2rem; font-weight: 500;">T</span> Text Size
                    </button>
                </div>

                <div class="video-captions-area module" id="captions-area">
                    <p class="placeholder-text">Captions will appear here when the session starts…</p>
                </div>
            </div>

            <!-- Q&A Sidebar -->
            <div class="qa-sidebar module">
                <div class="qa-header">
                    <div class="qa-title">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                        </svg>
                        <h3>Q&A</h3>
                    </div>
                    <span class="active-count" id="active-count">0 Active</span>
                </div>

                <div class="qa-feed" id="qa-feed"></div>

                <div class="qa-input-area">
                    <textarea class="qa-textarea" id="qa-input" placeholder="Ask a question..."></textarea>
                    <div class="qa-controls">
                        <label class="toggle-switch">
                            <input type="checkbox" id="anon-toggle" checked>
                            <span class="slider"></span>
                            <span class="toggle-label">Anonymous</span>
                        </label>
                        <button class="btn btn-primary submit-btn" id="submit-btn" type="button">Submit</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Action Bar -->
    <footer class="bottom-bar">
        <p>© 2026 lectralive. Building inclusive classrooms together.</p>
    </footer>

    <script type="module" src="/js/classroom.js"></script>
</body>

</html>
