<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lectralive - Student Dashboard</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%234f46e5'/><path d='M12 6C13.1046 6 14 6.89543 14 8C14 9.10457 13.1046 10 12 10C10.8954 10 10 9.10457 10 8C10 6.89543 10.8954 6 12 6Z' fill='white'/><path d='M12 11C8.68629 11 6 13.6863 6 17V18H18V17C18 13.6863 15.3137 11 12 11Z' fill='white'/></svg>" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
</head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-D197ZHGZ7C"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-D197ZHGZ7C');
    </script>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="24" height="24" rx="6" fill="var(--primary)" />
                    <path
                        d="M12 6C13.1046 6 14 6.89543 14 8C14 9.10457 13.1046 10 12 10C10.8954 10 10 9.10457 10 8C10 6.89543 10.8954 6 12 6Z"
                        fill="white" />
                    <path d="M12 11C8.68629 11 6 13.6863 6 17V18H18V17C18 13.6863 15.3137 11 12 11Z" fill="white" />
                </svg>
                <span>lectralive</span>
            </div>

            <div class="nav-actions">
                <button id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode">
                    <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>

                    <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>

                <button class="btn btn-outline" type="button" id="nav-signout-btn" style="display: inline-flex">
                    Sign out
                </button>
            </div>
        </div>
    </nav>

    <main class="view active" id="dashboard-view">
        <div class="dashboard-container" style="max-width: 1200px; margin: 3rem auto; padding: 0 2rem; width: 100%;">
            
            <div class="dashboard-header" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 2rem; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
                <div>
                    <h1 class="hero-title" style="font-size: 2rem; margin-bottom: 0.5rem;">
                        Welcome, <span class="highlight" id="dashboard-name">Student</span>!
                    </h1>
                    <p class="hero-subtitle" style="margin-bottom: 0;">
                        Enter your room code to join an active classroom.
                    </p>
                </div>
                <div class="join-box" style="margin: 0; max-width: 400px; flex: 1;">
                    <input type="text" placeholder="Room Code (e.g. bio-101)" id="room-code-input"
                        autocomplete="off" style="padding: 0.6rem 1rem;" />
                    <button class="btn btn-primary join-btn" id="join-btn" type="button" style="padding: 0.6rem 1.5rem;">
                        Join
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="past-classrooms" style="text-align: left;">
                <h3 style="font-size: 1.25rem; font-weight: 600; margin-bottom: 1.5rem;">Joined Classrooms</h3>
                <div id="classrooms-list" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem;">
                    <!-- JS injected rooms -->
                </div>
            </div>

        </div>
    </main>

    <footer class="bottom-bar">
        <p>© 2026 lectralive. Building inclusive classrooms together.</p>
    </footer>

    <script type="module" src="js/student_dash.js"></script>
</body>

</html>
